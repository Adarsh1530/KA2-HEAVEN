name: Build KA² Flutter Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Build Flutter Native Android Project
        run: |
          # 1. Create fresh official Flutter project
          flutter create --org world.ka2 --project-name ka2_heaven --platforms android build_runner
          cd build_runner

          # 2. Add required plugins
          flutter pub add webview_flutter webview_flutter_android permission_handler flutter_spinkit

          # 3. Inject our custom KA2 main.dart
          cp ../flutter_app/lib/main.dart lib/main.dart

          # 4. Inject Android Permissions in AndroidManifest.xml
          sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>/' android/app/src/main/AndroidManifest.xml

          # 5. Build Android Release APK
          flutter build apk --release --no-tree-shake-icons

      - name: Copy Generated APK
        run: cp build_runner/build/app/outputs/flutter-apk/app-release.apk KA2-HEAVEN-Release.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KA2-HEAVEN-Android-APK
          path: KA2-HEAVEN-Release.apk
          retention-days: 30
