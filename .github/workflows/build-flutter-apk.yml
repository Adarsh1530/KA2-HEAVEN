name: Build KA² Flutter Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-flutter:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Prepare Complete Android Project
        run: |
          mkdir -p /tmp/backup
          cp flutter_app/lib/main.dart /tmp/backup/main.dart
          cp flutter_app/pubspec.yaml /tmp/backup/pubspec.yaml
          
          cd flutter_app
          flutter create --org world.ka2 --project-name ka2_heaven --platforms android --empty .
          
          cp /tmp/backup/main.dart lib/main.dart
          cp /tmp/backup/pubspec.yaml pubspec.yaml

          # Add WebRTC, Camera, Mic and Storage permissions to AndroidManifest
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml

      - name: Fetch Flutter Dependencies
        run: flutter pub get
        working-directory: ./flutter_app

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons
        working-directory: ./flutter_app

      - name: Copy & Rename APK
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk KA2-HEAVEN-Release.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KA2-HEAVEN-Release-APK
          path: KA2-HEAVEN-Release.apk
          retention-days: 30
