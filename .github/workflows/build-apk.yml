name: Build KA² — HEAVEN Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Production Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Native Android Environment & Build Release APK
        working-directory: ./flutter_app
        run: |
          # 1. Clean incomplete platform files to allow fresh wrapper creation
          rm -rf android

          # 2. Let Flutter officially create Android files with full Gradle wrapper
          flutter create --org world.ka2 --project-name ka2_heaven --platforms android .

          # 3. Apply safe Python configuration for permissions & minSdkVersion 24
          python3 ../scripts/configure_android.py

          # 4. Make Gradle wrapper executable
          chmod +x android/gradlew

          # 5. Fetch dependencies
          flutter pub get

          # 6. Compile Release APK
          flutter build apk --release --no-tree-shake-icons

          # 7. Rename to official release binary
          cp "build/app/outputs/flutter-apk/app-release.apk" "build/app/outputs/flutter-apk/KA2 - HEAVEN.apk"

      - name: Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KA2 - HEAVEN
          path: "flutter_app/build/app/outputs/flutter-apk/KA2 - HEAVEN.apk"
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: KA² — HEAVEN Android Release v1.0.0
          body: |
            ## 🌸 KA² — HEAVEN Android Release APK
            *A Heaven Made for Two — Worldwide Couple Communication & Romantic World*

            ### 📲 Installation:
            1. Download `KA2 - HEAVEN.apk` below.
            2. Tap and install on your Android device.
          files: |
            flutter_app/build/app/outputs/flutter-apk/KA2 - HEAVEN.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
