name: Build KA² — HEAVEN Android Live APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Build Shared Core & Mobile Web Assets
        run: |
          npm run build:shared
          npm run build:mobile

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Assets
        run: |
          npx cap sync android
        working-directory: ./mobile

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew
        working-directory: ./mobile/android

      - name: Build Android Release APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ./mobile/android

      - name: Rename APK for Easy Download
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk KA2-HEAVEN.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KA2-HEAVEN-Android-APK
          path: KA2-HEAVEN.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-apk
          name: "KA² — HEAVEN Android Release v1.0.0"
          body: "Official Android APK for KA² — HEAVEN (A Heaven Made for Two ❤️)"
          files: KA2-HEAVEN.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
