name: Build KA² — HEAVEN Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Scaffold & Prepare Android App
        run: |
          # 1. Create a clean Flutter project structure in temporary workspace
          rm -rf /tmp/ka2_flutter
          flutter create --org world.ka2 --project-name ka2_heaven --platforms android /tmp/ka2_flutter
          
          # 2. Copy our customized WebRTC/WebView code and dependencies
          cp flutter_app/lib/main.dart /tmp/ka2_flutter/lib/main.dart
          cp flutter_app/pubspec.yaml /tmp/ka2_flutter/pubspec.yaml
          
          # 3. Add WebRTC, Camera, Mic and Storage permissions to AndroidManifest
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>' /tmp/ka2_flutter/android/app/src/main/AndroidManifest.xml

      - name: Fetch Dependencies
        run: |
          cd /tmp/ka2_flutter
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd /tmp/ka2_flutter
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/KA2-HEAVEN.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KA2-HEAVEN-Release-APK
          path: KA2-HEAVEN.apk
          retention-days: 30
