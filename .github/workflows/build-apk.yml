name: Build KA² — HEAVEN Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Production Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Native Android Environment & Build Release APK
        working-directory: ./flutter_app
        run: |
          # 1. Clean incomplete platform files to allow fresh wrapper creation
          rm -rf android

          # 2. Let Flutter officially create Android files with full Gradle wrapper
          flutter create --org world.ka2 --project-name ka2_heaven --platforms android .

          # 3. Add Android permissions and cleartext traffic support in AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n\n    <application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          # 4. Ensure minSdkVersion is 24 for WebView & WebRTC compatibility
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 24/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle

          # 5. Make Gradle wrapper executable
          chmod +x android/gradlew

          # 6. Fetch dependencies
          flutter pub get

          # 7. Compile Release APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KA2-HEAVEN-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: KA² — HEAVEN Android Release v1.0.0
          body: |
            ## 🌸 KA² — HEAVEN Android Release APK
            *A Heaven Made for Two — Worldwide Couple Communication & Romantic World*

            ### 📲 Installation:
            1. Download `KA2-HEAVEN-Release.apk` below.
            2. Tap and install on your Android device.
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
