name: Build KA² — HEAVEN Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Production Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android Release APK
        working-directory: ./flutter_app
        run: |
          flutter create . --platforms=android --org world.ka2
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KA2-HEAVEN-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: KA² — HEAVEN Android Release v1.0.0
          body: |
            ## 🌸 KA² — HEAVEN Android Release APK
            *A Heaven Made for Two — Worldwide Couple Communication & Romantic World*

            ### 📲 Installation:
            1. Download `KA2-HEAVEN-Release.apk` below.
            2. Tap and install on your Android device.
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
